name: FlyBrain Windows VST3
on:
  push:
    branches: [ flybrain-vst3-build ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S FlyBrainBuild -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrainSynth-Windows-VST3
          path: |
            build/FlyBrainSynth_artefacts/Release/VST3/**
            build/FlyBrainSynth_artefacts/Release/Standalone/**
          if-no-files-found: error
